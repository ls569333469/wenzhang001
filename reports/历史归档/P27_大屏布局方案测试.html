<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P27 大屏布局 3 种方案实测</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, 'Microsoft YaHei', sans-serif;
            background: #f4f4f5;
            color: #18181b;
            /* 模拟整个浏览器视口 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航模拟 */
        .mock-navbar {
            height: 64px;
            background: #fff;
            border-bottom: 1px solid #e4e4e7;
            display: flex;
            align-items: center;
            padding: 0 24px;
            flex-shrink: 0;
            z-index: 50;
        }

        .mock-navbar-logo {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        /* ------------------- 核心布局容器 ------------------- */
        .workspace-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* 左侧面板模拟 */
        .mock-sidebar {
            width: 356px;
            background: #fafafa;
            border-right: 1px solid #e4e4e7;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a1a1aa;
            font-size: 14px;
            font-weight: 500;
            transition: width 0.3s ease;
        }

        /* 右侧面板模拟 */
        .mock-right-sidebar {
            width: 280px;
            background: #fff;
            border-left: 1px solid #e4e4e7;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a1a1aa;
            font-size: 14px;
            font-weight: 500;
        }

        /* ------------------- 主内容区 (关键！) ------------------- */
        /* 
           重点：main-content 占据所有剩余空间 (2560 - 356 - 280 = 1924px)
           内部的所有元素（Input, Canvas, DataPanel）在一个组（content-group）里居中对齐
        */
        .main-content {
            flex: 1;
            /* width: ~1924px */
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            align-items: center;
            /* 核心：内容水平居中 */
            padding-top: 40px;
            padding-bottom: 80px;
            position: relative;
            background: #fff;
        }

        /* 
           内部组：包含可能出现的 DataPanel 和 Canvas。
           这是所有方案的基石：保证它们在一起，作为一个整体居中。 
        */
        .content-group {
            display: flex;
            align-items: flex-start;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            /* X 轴平移，用于模式切换时的平滑动画 */
            transform: translateX(0);
        }

        /* ------------------- 组件模块 ------------------- */
        .data-panel-wrapper {
            /* 默认隐藏，在相关模式下才显示 */
            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            /* 防止内容挤压变形 */
            flex-shrink: 0;
            margin-right: 0;
        }

        .data-panel-inner {
            background: #fafafa;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            height: calc(100vh - 160px);
            position: sticky;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #71717a;
            font-size: 14px;
            font-weight: 600;
        }

        .editor-column {
            display: flex;
            flex-direction: column;
            /* 宽度由具体的方案 (Plan A/B/C) 决定 */
            transition: width 0.4s ease;
            flex-shrink: 0;
        }

        .hero-input {
            width: 100%;
            height: 56px;
            background: #f4f4f5;
            border: 1.5px solid #e4e4e7;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            color: #71717a;
            font-size: 14px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .writing-canvas {
            width: 100%;
            min-height: 600px;
            background: #fff;
            border: 1px dashed #d4d4d8;
            border-radius: 12px;
            padding: 40px;
        }

        /* 骨架屏线条模拟内容 */
        .skeleton-tit {
            height: 28px;
            width: 60%;
            background: #e4e4e7;
            border-radius: 6px;
            margin-bottom: 24px;
        }

        .skeleton-line {
            height: 12px;
            width: 100%;
            background: #f4f4f5;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .skeleton-line.short {
            width: 85%;
        }

        .skeleton-line.shorter {
            width: 40%;
            margin-bottom: 32px;
        }


        /* ========================================================================= */
        /*                           具体方案的参数覆写                              */
        /* ========================================================================= */

        /* ============== 方案 1：极简克制版 (Option 1) ============== */
        /* 
           特点：阅读体验最高，行宽最接近传统文档（如 Notion 默认）
           参数：内容区 800px / DataPanel 320px
        */
        .plan-1 .editor-column {
            width: 800px;
        }

        .plan-1.has-panel .data-panel-wrapper {
            width: 320px;
            opacity: 1;
            margin-right: 32px;
        }

        /* ============== 方案 2：宽松现代版 (Option 2) ============== */
        /* 
           特点：更适合超大宽屏，单行信息量更大，但又不会太满，主流 Web3 端游/SaaS 常用 
           参数：内容区 960px (~max-w-4xl) / DataPanel 360px
        */
        .plan-2 .editor-column {
            width: 960px;
        }

        .plan-2.has-panel .data-panel-wrapper {
            width: 360px;
            opacity: 1;
            margin-right: 40px;
        }

        /* ============== 方案 3：充分利用版 (Option 3) ============== */
        /* 
           特点：针对 32寸 2560px 追求极致信息密度，稍微霸道，类似 IDE 的逻辑
           参数：内容区 1120px (~max-w-6xl) / DataPanel 400px
        */
        .plan-3 .editor-column {
            width: 1120px;
        }

        .plan-3.has-panel .data-panel-wrapper {
            width: 400px;
            opacity: 1;
            margin-right: 40px;
        }


        /* ------------------- 动画辅助：居中组平移补偿 ------------------- */
        /* 
           由于 DataPanel 的出现会改变 group 的总宽度，为了让我们重点关注的 `editor-column` (输入框和文本)
           在视觉上保持不动（不发生位置跳变），我们在出现面板时，通过 transform 把它强行拉回来半个面板的宽度。
        */
        .plan-1.has-panel .content-group {
            transform: translateX(176px);
            /* 320/2 + 32/2 */
        }

        .plan-2.has-panel .content-group {
            transform: translateX(200px);
            /* 360/2 + 40/2 */
        }

        .plan-3.has-panel .content-group {
            transform: translateX(220px);
            /* 400/2 + 40/2 */
        }


        /* ========================================================================= */
        /*                           控制面板 UI (仅用于 Demo 交互)                    */
        /* ========================================================================= */
        .controls {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 24px;
            z-index: 999;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-label {
            font-size: 12px;
            font-weight: 600;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #d4d4d8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .ctrl-btn.active {
            background: #fff;
            color: #18181b;
            font-weight: 600;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.15);
        }

        .metrics-hud {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
            font-family: monospace;
            color: #52525b;
            pointer-events: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .metrics-hud strong {
            color: #f59e0b;
        }
    </style>
</head>

<!-- 默认启动 方案2，不带面板 -->

<body class="plan-2">

    <!-- Navbar -->
    <header class="mock-navbar">
        <div class="mock-navbar-logo">Quantum Studio <span
                style="font-weight:400;color:#a1a1aa;font-size:14px;margin-left:8px">布局方案实测 (100VW/100VH)</span></div>
    </header>

    <!-- Workspace -->
    <div class="workspace-container">

        <!-- Left Sidebar (ConfigPanel / AppSidebar) -->
        <aside class="mock-sidebar">
            左栏<br>~356px
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">

            <div class="metrics-hud" id="hud">
                <div>中心可用宽: <strong id="val-avail">--</strong> px</div>
                <div>Editor 宽度: <strong id="val-edit">--</strong> px</div>
                <div>Panel 宽度: <strong id="val-panel">--</strong> px</div>
                <div>单侧留白: <strong id="val-margin">--</strong> px</div>
            </div>

            <!-- Content Group -->
            <div class="content-group">

                <!-- Data Panel (Slide in/out) -->
                <div class="data-panel-wrapper">
                    <div class="data-panel-inner w-full">
                        DataPanel / 看板
                    </div>
                </div>

                <!-- Editor Column (Input + Canvas) -->
                <div class="editor-column">
                    <div class="hero-input">
                        HeroInput (输入框) —— 宽度始终与下方排版对齐...
                    </div>
                    <div class="writing-canvas">
                        <div class="skeleton-tit"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line shorter"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div style="font-size:14px;color:#a1a1aa;margin-top:60px;text-align:center;">
                            WritingCanvas (主要内容区)<br>
                            核心要求：在出现左侧侧边栏时，由于上方加了 transform 补偿，此区域在屏幕上的<b>绝对物理位置不会发生跳动</b>。
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Right Sidebar (UnifiedSidebar) -->
        <aside class="mock-right-sidebar">
            右栏<br>280px
        </aside>

    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="ctrl-group">
            <span class="ctrl-label">切换方案:</span>
            <button class="ctrl-btn" onclick="setPlan(1)" id="btn-p1">方案 1 (克制 800px)</button>
            <button class="ctrl-btn active" onclick="setPlan(2)" id="btn-p2">方案 2 (宽松 960px)</button>
            <button class="ctrl-btn" onclick="setPlan(3)" id="btn-p3">方案 3 (拉满 1120px)</button>
        </div>
        <div class="divider"></div>
        <div class="ctrl-group">
            <span class="ctrl-label">切换模式 (测试动画):</span>
            <button class="ctrl-btn active" onclick="setMode('no-panel')" id="btn-m1">中篇/长篇 (无数据面板)</button>
            <button class="ctrl-btn" style="color:#f59e0b; border-color:rgba(245,158,11,0.3)"
                onclick="setMode('has-panel')" id="btn-m2">吹捧/Kaito (带数据面板)</button>
        </div>
    </div>


    <script>
        let currentPlan = 2;
        let hasPanel = false;

        function updateHUD() {
            setTimeout(() => {
                const editor = document.querySelector('.editor-column');
                const panel = document.querySelector('.data-panel-wrapper');
                const main = document.querySelector('.main-content');
                const group = document.querySelector('.content-group');

                document.getElementById('val-avail').innerText = main.offsetWidth;
                document.getElementById('val-edit').innerText = editor.offsetWidth;
                document.getElementById('val-panel').innerText = hasPanel ? panel.offsetWidth : '0';

                // 计算实际留白: (外层宽度 - 组的总宽度) / 2
                let totalGroupWidth = editor.offsetWidth;
                if (hasPanel) totalGroupWidth += panel.offsetWidth + parseFloat(window.getComputedStyle(panel).marginRight);
                const margin = (main.offsetWidth - totalGroupWidth) / 2;
                document.getElementById('val-margin').innerText = Math.round(margin);
            }, 50); // wait for CSS transitions
        }

        function setPlan(num) {
            currentPlan = num;
            document.body.className = `plan-${num} ${hasPanel ? 'has-panel' : ''}`;

            document.getElementById('btn-p1').classList.remove('active');
            document.getElementById('btn-p2').classList.remove('active');
            document.getElementById('btn-p3').classList.remove('active');
            document.getElementById(`btn-p${num}`).classList.add('active');
            updateHUD();
        }

        function setMode(mode) {
            hasPanel = mode === 'has-panel';
            document.body.className = `plan-${currentPlan} ${hasPanel ? 'has-panel' : ''}`;

            document.getElementById('btn-m1').classList.toggle('active', !hasPanel);
            document.getElementById('btn-m2').classList.toggle('active', hasPanel);
            if (hasPanel) {
                document.getElementById('btn-m2').style.background = '#f59e0b';
                document.getElementById('btn-m2').style.color = '#fff';
            } else {
                document.getElementById('btn-m2').style.background = '';
                document.getElementById('btn-m2').style.color = '#f59e0b';
            }
            updateHUD();
        }

        // Init
        window.addEventListener('resize', updateHUD);
        updateHUD();
    </script>
</body>

</html>
