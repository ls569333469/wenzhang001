<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Studio - Web3 Blogger Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 950: '#09090b', 900: '#18181b', 800: '#27272a' },
                        indigo: { 500: '#6366f1', 600: '#4f46e5' } // Linear Purple/Blue
                    }
                }
            }
        }
    </script>
    <!-- Phosphor Icons: The cleanest icon set for 2026 -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-zinc-950 text-zinc-200 h-screen w-screen overflow-hidden flex selection:bg-indigo-500/30">

    <!-- ADAPTIVE SIDEBAR (280px) -->
    <aside
        class="w-[280px] bg-zinc-900/40 border-r border-white/5 flex flex-col h-full flex-shrink-0 backdrop-blur-xl relative z-50">

        <!-- 1. SPACE SWITCHER (Top Dropdown) -->
        <div class="h-14 px-3 flex items-center border-b border-white/5">
            <button
                class="flex items-center gap-3 text-sm font-medium hover:bg-white/5 px-2 py-1.5 rounded-lg w-full transition-all group">
                <!-- Icon represents Current Space -->
                <div
                    class="w-6 h-6 rounded bg-indigo-500/20 text-indigo-400 flex items-center justify-center shadow-inner ring-1 ring-inset ring-white/5">
                    <i class="ph-bold ph-pen-nib"></i>
                </div>
                <div class="flex flex-col items-start gap-0.5">
                    <span class="text-zinc-100 leading-none">Studio Space</span>
                    <span class="text-[10px] text-zinc-500 font-medium">Writing & Creation</span>
                </div>
                <i class="ph-bold ph-caret-up-down ml-auto text-zinc-600 group-hover:text-zinc-400"></i>
            </button>
        </div>

        <!-- 2. SEARCH (Global Context) -->
        <div class="px-3 py-3">
            <div class="relative group">
                <i
                    class="ph ph-magnifying-glass absolute left-2.5 top-2.5 text-zinc-500 text-sm group-focus-within:text-indigo-400"></i>
                <input type="text" placeholder="Search Knowledge..."
                    class="w-full bg-zinc-950/50 border border-white/5 rounded-lg pl-8 pr-3 py-2 text-sm text-zinc-300 placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-indigo-500/50 transition-all">
                <div
                    class="absolute right-2 top-2 text-[10px] text-zinc-600 border border-zinc-800 rounded px-1.5 py-0.5">
                    Example: Base</div>
            </div>
        </div>

        <!-- 3. SCROLLABLE CONTENT (The "Meat") -->
        <div class="flex-1 overflow-y-auto no-scrollbar px-2 space-y-6">

            <!-- A. 知识库引用 (Web3 Blogger 必用) -->
            <!-- 这里展示的是 UCB 里的 "赛道 (Topic)" -->
            <div>
                <div class="px-2 mb-2 flex items-center justify-between group">
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">Target Topics</span>
                    <span class="text-[10px] text-zinc-600">Synced 2m ago</span>
                </div>

                <ul class="space-y-0.5">
                    <!-- Tree Item: Base Chain (Expanded) -->
                    <li>
                        <button
                            class="flex items-center gap-2 w-full px-2 py-1.5 rounded-md bg-white/5 text-zinc-100 text-sm font-medium transition-colors">
                            <i class="ph-fill ph-folder-open text-indigo-400"></i>
                            Base Ecosystem
                        </button>
                        <!-- Children -->
                        <ul class="pl-2 mt-1 space-y-0.5 ml-2 border-l border-white/10">
                            <li>
                                <button
                                    class="flex items-center gap-2 w-full px-2 py-1.5 rounded-md text-zinc-300 hover:text-white hover:bg-white/5 text-sm transition-colors group">
                                    <i class="ph ph-article text-zinc-500 group-hover:text-zinc-400"></i>
                                    DeFi Weekly Report
                                    <span
                                        class="ml-auto text-[10px] bg-green-500/10 text-green-500 px-1 rounded">HOT</span>
                                </button>
                            </li>
                            <li>
                                <button
                                    class="flex items-center gap-2 w-full px-2 py-1.5 rounded-md text-zinc-300 hover:text-white hover:bg-white/5 text-sm transition-colors">
                                    <i class="ph ph-article text-zinc-500"></i>
                                    Friend.tech Analysis
                                </button>
                            </li>
                        </ul>
                    </li>

                    <!-- Tree Item: SOL -->
                    <li>
                        <button
                            class="flex items-center gap-2 w-full px-2 py-1.5 rounded-md text-zinc-400 hover:text-zinc-200 hover:bg-white/5 text-sm transition-colors group">
                            <i class="ph-fill ph-folder text-zinc-600 group-hover:text-zinc-500"></i>
                            Solana Memes
                        </button>
                    </li>
                </ul>
            </div>

            <!-- B. 风格库 (Lark Config) -->
            <div>
                <div class="px-2 mb-2 flex items-center justify-between">
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">Style Persona</span>
                </div>
                <ul class="space-y-0.5">
                    <!-- Active Style -->
                    <li>
                        <button
                            class="flex items-center gap-2 w-full px-2 py-1.5 rounded-md bg-indigo-500/10 text-indigo-200 ring-1 ring-indigo-500/20 text-sm font-medium transition-colors">
                            <div class="w-1.5 h-1.5 rounded-full bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.5)]">
                            </div>
                            Crypto Degen (毒舌)
                            <i class="ph-fill ph-check-circle ml-auto text-indigo-500"></i>
                        </button>
                    </li>
                    <li>
                        <button
                            class="flex items-center gap-2 w-full px-2 py-1.5 rounded-md text-zinc-400 hover:text-zinc-200 hover:bg-white/5 text-sm transition-colors">
                            <div class="w-1.5 h-1.5 rounded-full bg-zinc-600"></div>
                            Professional VC (客观)
                        </button>
                    </li>
                </ul>
            </div>

            <!-- C. 输出控制 (Quick Settings) -->
            <!-- 只有最常用的放在这里，其他去 Settings -->
            <div>
                <div class="px-2 mb-2 flex items-center justify-between">
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">Output</span>
                </div>
                <div class="px-2 flex gap-2">
                    <button
                        class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-xs py-1.5 rounded text-zinc-400 border border-white/5 transition-colors">Short</button>
                    <button
                        class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-xs py-1.5 rounded text-zinc-400 border border-white/5 transition-colors">Medium</button>
                    <button
                        class="flex-1 bg-zinc-100 text-zinc-900 text-xs py-1.5 rounded font-bold shadow-lg shadow-white/10 transition-colors">Long</button>
                </div>
            </div>

        </div>

        <!-- 4. FOOTER (Settings Hiding Place) -->
        <div class="p-3 border-t border-white/5 bg-zinc-900/40">
            <button
                class="flex items-center gap-3 w-full px-2 py-2 rounded-lg hover:bg-white/5 transition-colors text-left group">
                <div class="relative">
                    <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Felix" alt="User"
                        class="w-8 h-8 rounded-full bg-zinc-800 ring-1 ring-white/10 group-hover:ring-white/20">
                    <div
                        class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 border-2 border-zinc-900 rounded-full">
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-sm font-medium text-zinc-200 truncate">Web3 Master</div>
                    <div class="text-[10px] text-zinc-500 truncate flex items-center gap-1">
                        Free Token: 50
                    </div>
                </div>
                <i class="ph-bold ph-gear text-zinc-600 group-hover:text-zinc-400 transition-colors"></i>
            </button>
        </div>
    </aside>

    <!-- MAIN CANVAS (Preview) -->
    <main
        class="flex-1 bg-zinc-950 flex flex-col relative overflow-hidden bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-90">
        <div class="flex-1 flex items-center justify-center text-zinc-600">
            <div class="text-center">
                <i class="ph-duotone ph-pen-nib text-6xl mb-4 opacity-20"></i>
                <p>Select a topic from the left to start writing</p>
            </div>
        </div>
    </main>

</body>

</html>
