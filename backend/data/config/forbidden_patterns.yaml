# ===================== 第三层：AI模板指纹词 =====================
# 跨篇重复审计发现，不同素材反复使用的"写作拐杖"

template_fingerprints:
  - 你想想          # 6轮/10轮，最强AI指纹
  - 直接            # 7轮/10轮，AI强调惯性搭配
  - 根本            # 6轮/10轮，AI加重句式
  - 不过是          # 4轮/10轮，AI反转贬低句式
  - 接下来          # 4轮/10轮，AI过渡词


# ===================== 第四层：废话文学 =====================

filler_generic:
  - 加密市场充满不确定性
  - 区块链技术正在快速发展
  - 在当前市场环境下

filler_endings:
  - 让我们拭目以待
  - 后续值得关注
  - 时间会给出答案
  - 这会是XX的开端吗？

filler_fake_thinking:
  - 这不禁让人思考
  - 值得深思
  - 引人深省

filler_fence_sitting:
  - 机遇与挑战并存
  - 有人看多有人看空
  - 各有利弊

filler_transitions:
  - 众所周知
  - 说到这里不得不提
  - 事实上
