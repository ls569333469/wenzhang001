# 风格库配置文件
# P10: 仅保留有实际样本数据的风格

styles:
  # ========== 有数据的风格 (2个) ==========
  mimeng:
    id: "mimeng"
    name: "咪蒙体"
    icon: "🔥"
    color: "#ef4444"
    description: "痛点戳刺、情绪引爆、立场鲜明"
    data_dir: "data/mimeng"
    max_samples: 3
    traits:
      tone: "激进、焦虑、戳心、制造冲突"
      structure: "短句成段、金句频出、情绪升华"
      sentence_style: "反问句开头，排比句强化，多用'你是不是''别傻了'"
    forbidden_words: ["delve", "tapestry", "landscape", "crucial"]
    temperature: 0.85

  banfo:
    id: "banfo"
    name: "半佛仙人体"
    icon: "🧠"
    color: "#10b981"
    description: "反常识观点、案例轰炸、硬核科普"
    data_dir: "data/banfo"
    max_samples: 3
    traits:
      tone: "犀利、幽默、理性、恍然大悟"
      structure: "抛出反常识→案例轰炸→逻辑链条→观点升华"
      sentence_style: "口语化表达，多用'其实''说白了'，段子穿插"
    forbidden_words: ["delve", "tapestry"]
    temperature: 0.6

# ========== 预设组合 (仅保留有效的) ==========
combinations:
  project_review:
    id: "project_review"
    name: "项目评测"
    description: "半佛式逻辑 + 咪蒙式痛点"
    styles:
      - { id: "banfo", weight: 60 }
      - { id: "mimeng", weight: 40 }
    recommended_for: ["项目评测", "骗局揭秘", "避坑指南"]

